services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    env_file:
      - apps/api/.env
    environment:
      GOVERNANCE_REPORT_DIR: /app/generated_reports
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./apps/api:/app
      - ./apps/api/generated_reports:/app/generated_reports
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /app
    env_file:
      - apps/web/.env
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    ports:
      - "5173:5173"
